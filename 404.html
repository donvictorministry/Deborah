<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening note...</title>
<!-- GitHub Pages 404 hack: turns /Repo/note/abc into /Repo/?/note/abc (hash kept) so index.html can open it.
     Set pathSegmentsToKeep = 1 for project sites (user.github.io/Repo/), 0 for user sites or a custom domain. -->
<script>
  var pathSegmentsToKeep = 1;
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>

</head>
<body><p>Opening your note...<br><a href="./">Tap here if nothing happens</a></p></body>
</html>
