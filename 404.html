<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening note...</title>
<script>
/* GitHub Pages 404 -> clean note URLs.
   /<repo>/note/<title>-<id>  becomes  /<repo>/?/note/<title>-<id>  (index.html restores the clean address).
   The part after # (a shared note) is kept. Works for user sites and project sites, no settings needed. */
(function () {
  var l = window.location, p = l.pathname, i = p.indexOf('/note/');
  if (i > -1) {
    l.replace(l.origin + p.slice(0, i + 1) + '?/' + p.slice(i + 1) + l.hash);
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('dvHome').href = p.replace(/[^\/]*$/, '') || '/';
      document.getElementById('dvMsg').style.display = 'block';
    });
  }
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Roboto,Arial,sans-serif;background:#fff;color:#121212;text-align:center}
#dvMsg{display:none;padding:24px}
h1{font-size:1.6rem;margin:0 0 12px}
a{display:inline-block;margin-top:16px;padding:14px 28px;background:#1877F2;color:#fff;border-radius:12px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div id="dvMsg"><h1>Page not found</h1><div>This address does not exist.</div><a id="dvHome" href="./">Go to the app</a></div>
<noscript>Please turn on JavaScript to open this note.</noscript>
</body>
</html>
