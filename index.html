<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1877F2">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Deborah)-(Note</title>
<script>try{var d=document.documentElement;d.dataset.theme=localStorage.getItem('dvn.theme')||'light';d.style.setProperty('--dv-fs',(localStorage.getItem('dvn.fs')||19)+'px')}catch(e){}</script>
</head>
<body>

<header class="dv-top">
  <button class="dv-ib dv-tap" id="dv-menuL" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="dv-title">Deborah)-(Note</h1>
  <button class="dv-ib dv-tap" id="dv-menuR" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
</header>

<main class="dv-views">
  <section class="dv-view" id="dv-view-home"></section>
  <section class="dv-view" id="dv-view-editor" hidden><p class="dv-none">The Notepad module is not installed.</p></section>
  <section class="dv-view" id="dv-view-more" hidden><p class="dv-none">The More module is not installed.</p></section>
</main>

<nav class="dv-nav" aria-label="Main">
  <button class="dv-nb dv-tap dv-on" data-t="home" aria-current="page"><span class="dv-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span><span>Home</span></button>
  <button class="dv-nb dv-tap" data-t="editor"><span class="dv-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><span>Editor</span></button>
  <button class="dv-nb dv-tap" data-t="more"><span class="dv-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>More</span></button>
</nav>

<aside class="dv-sheet" id="dv-left" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="dv-top dv-lf"><button class="dv-ib dv-tap dv-bk" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><h2>Menu</h2></div>
  <div class="dv-body" id="dv-leftB"></div>
</aside>

<aside class="dv-sheet" id="dv-right" role="dialog" aria-modal="true" aria-label="Options" hidden>
  <div class="dv-top dv-lf"><button class="dv-ib dv-tap dv-bk" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><h2>Options</h2></div>
  <div class="dv-body" id="dv-rightB"></div>
</aside>

<section class="dv-sheet dv-pg" id="dv-page" role="dialog" aria-modal="true" hidden>
  <div class="dv-top dv-lf"><button class="dv-ib dv-tap dv-bk" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button><h2 id="dv-pageT"></h2></div>
  <div class="dv-body dv-pad" id="dv-pageB"></div>
</section>

<div class="dv-scrim" id="dv-ask" role="alertdialog" aria-modal="true" hidden>
  <div class="dv-card"><h3 class="dv-h" id="dv-askT"></h3><p id="dv-askM"></p>
    <div class="dv-acts"><button class="dv-btn dv-o dv-tap" id="dv-askN">Cancel</button><button class="dv-btn dv-tap" id="dv-askY">Confirm</button></div></div>
</div>
<div class="dv-scrim" id="dv-busy" hidden><div class="dv-spin" role="progressbar" aria-label="Working"></div></div>
<div id="dv-toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<!-- Independent modules: each is self-contained and can be deleted without breaking the app -->
<script src="notepad.js"></script>
<script src="editor.js"></script>
<script src="more.js"></script>
<script src="cover-page.js"></script>
<script src="computer-block.js"></script>
</body>
</html>
