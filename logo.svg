<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" width="750" height="180" role="img" aria-label="Deborah)-(Note" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .w{font-family:Roboto,"Segoe UI",Arial,sans-serif;font-weight:800;font-size:84px;fill:#fff}
    .m{fill:none;stroke:#FFC107;stroke-width:10;stroke-linecap:round}
    .w1{animation:l .8s .3s cubic-bezier(.2,.8,.2,1) both}
    .w2{animation:r .8s .55s cubic-bezier(.2,.8,.2,1) both}
    .pl{animation:l .7s cubic-bezier(.2,.8,.2,1) both}
    .pr{animation:r .7s cubic-bezier(.2,.8,.2,1) both}
    .dash{stroke-dasharray:100;animation:d .45s .65s ease-out both}
    .mark{animation:p 1.4s 1.5s ease-in-out 2}
    @keyframes l{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
    @keyframes r{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
    @keyframes d{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="750" height="180" rx="36" fill="#1877F2"/>
  <text class="w w1" x="50" y="120" textLength="340" lengthAdjust="spacingAndGlyphs">Deborah</text>
  <g class="mark">
    <path class="m pl" d="M410 46 C434 74 434 106 410 134"/>
    <path class="m dash" pathLength="100" d="M440 90 L460 90"/>
    <path class="m pr" d="M490 46 C466 74 466 106 490 134"/>
  </g>
  <text class="w w2" x="510" y="120" textLength="190" lengthAdjust="spacingAndGlyphs">Note</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
